<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="juego">
        <h1>🪨 Piedra, Papel o Tijera ✂️</h1>
        <h2>Mejor de 3</h2>

        <div class="marcador">
            <div>
                <p>Vos</p>
                <span id="puntosUsuario">0</span>
            </div>

            <div>
                <p>Máquina</p>
                <span id="puntosMaquina">0</span>
            </div>
        </div>

        <p id="mensaje">Elegí una opción para comenzar</p>

        <div class="botones">
            <button id="piedra">🪨 Piedra</button>
            <button id="papel">📄 Papel</button>
            <button id="tijera">✂️ Tijera</button>
        </div>

        <div class="resultado">
            <p id="jugadaUsuario">Tu jugada: -</p>
            <p id="jugadaMaquina">Jugada de la máquina: -</p>
        </div>

        <button id="reiniciar">🔄 Volver a jugar</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
